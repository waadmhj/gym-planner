databases:
  - name: gym-planner-db
    plan: free
    databaseName: gym_planner
    user: gym_planner

services:
  - type: web
    name: gym-training-planner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gym-planner-db
          property: connectionString
